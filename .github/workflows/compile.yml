name: Compile VCAndroidAuto

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Compile Java Code
      run: |
        mkdir -p build/classes
        mkdir -p build/out
        
        # Скачиваем lsd.jar из репозитория для успешной сборки
        curl -L -o tools/lsd.jar https://github.com || true
        
        # Компилируем исправленный файл с поддержкой старой Java
        javac -source 1.6 -target 1.6 -cp "tools/lsd.jar" -d build/classes src/de/vw/mib/asl/internal/androidauto/target/NavigationHandler.java
        
    - name: Create JAR Archive
      run: |
        jar cvf build/out/VCAndroidAuto.jar -C build/classes .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VCAndroidAuto-Fixed-Jar
        path: build/out/VCAndroidAuto.jar
