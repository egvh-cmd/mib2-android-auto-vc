name: Compile VCAndroidAuto

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Compile Target Files with lsd.jar
      run: |
        mkdir -p build/classes
        mkdir -p build/out
        
        # Компилируем ИСКЛЮЧИТЕЛЬНО два наших файла.
        # Все зависимости (включая ManeuverDescriptorSender) javac возьмет в готовом виде из оригинального tools/lsd.jar
        javac -source 1.6 -target 1.6 -cp "tools/lsd.jar" -d build/classes \
          src/de/vw/mib/asl/internal/androidauto/target/NavTurn.java \
          src/de/vw/mib/asl/internal/androidauto/target/NavigationHandler.java
        
    - name: Create JAR Archive
      run: |
        # Упаковываем скомпилированные классы в итоговый патч
        jar cvf build/out/VCAndroidAuto.jar -C build/classes de

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VCAndroidAuto-Fixed-Jar
        path: build/out/VCAndroidAuto.jar
