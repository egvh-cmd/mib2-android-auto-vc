name: Compile VCAndroidAuto

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Create Clean Stub Classes for Compilation
      run: |
        mkdir -p src/de/vw/mib/asl/api/navbap
        mkdir -p src/de/vw/mib/bap/mqbab2/common/api/navigation
        mkdir -p src/org/dsi/ifc/androidauto2
        mkdir -p src/org/dsi/ifc/navigation
        mkdir -p src/de/adi961/miblogger
        mkdir -p src/de/vw/mib/asl/internal/navigation/api/impl/ext/map/instrumentcluster

        # 1. Логгер
        echo "package de.adi961.miblogger; public class MIBLogger { public static MIBLogger getInstance() { return new MIBLogger(); } public void trace(String s) {} public void error(String s) {} public void info(String s) {} public void debug(String s) {} }" > src/de/adi961/miblogger/MIBLogger.java
        
        # 2. Интерфейсы шины BAP (Virtual Cockpit)
        echo "package de.vw.mib.asl.api.navbap; public class ASLNavBAPFactory { public static NavBAPApi getNavBAPApi() { return new NavBAPApi(); } public static class NavBAPApi { public void updateBapTurnToInfo(String s1, String s2) {} public void updateBapDistanceToNextManeuver(int d, int u, boolean b, int bg) {} } }" > src/de/vw/mib/asl/api/navbap/ASLNavBAPFactory.java
        echo "package de.vw.mib.bap.mqbab2.common.api; import de.vw.mib.bap.mqbab2.common.api.navigation.NavigationASLDataAdapter; public class APIFactory { public static APIFactory getAPIFactory() { return new APIFactory(); } public Object getNavigationService() { return new NavigationASLDataAdapter(); } }" > src/de/vw/mib/bap/mqbab2/common/api/APIFactory.java
        echo "package de.vw.mib.bap.mqbab2.common.api.navigation; public class NavigationASLDataAdapter { public void datapoolValueChanged(int id) {} }" > src/de/vw/mib/bap/mqbab2/common/api/navigation/NavigationASLDataAdapter.java
        
        # 3. Константы Android Auto
        echo "package org.dsi.ifc.androidauto2; public class Constants { public static final int NAVFOCUS_NATIVE = 1; public static final int NAVFOCUS_PROJECTED = 2; public static final int NAVIGATIONTURNEVENT_OFF_RAMP = 0; public static final int NAVIGATIONTURNEVENT_ROUNDABOUT_EXIT = 0; public static final int NAVIGATIONTURNEVENT_ROUNDABOUT_ENTER_AND_EXIT = 0; public static final int NAVIGATIONTURNEVENT_DEPART = 0; public static final int NAVIGATIONTURNEVENT_TURN = 0; public static final int NAVIGATIONTURNEVENT_SLIGHT_TURN = 0; public static final int NAVIGATIONTURNEVENT_SHARP_TURN = 0; public static final int NAVIGATIONTURNEVENT_ON_RAMP = 0; public static final int NAVIGATIONTURNEVENT_MERGE = 0; public static final int NAVIGATIONTURNEVENT_NAME_CHANGE = 0; public static final int NAVIGATIONTURNEVENT_STRAIGHT = 0; public static final int NAVIGATIONTURNEVENT_FORK = 0; public static final int NAVIGATIONTURNEVENT_U_TURN = 0; public static final int NAVIGATIONTURNEVENT_ROUNDABOUT_ENTER = 0; public static final int NAVIGATIONTURNEVENT_DESTINATION = 0; public static final int NAVIGATIONTURNSIDE_LEFT = 1; public static final int NAVIGATIONTURNSIDE_RIGHT = 2; }" > src/org/dsi/ifc/androidauto2/Constants.java
        
        # 4. Класс оригинального дескриптора VAG
        echo "package org.dsi.ifc.navigation; public class BapManeuverDescriptor { public int mainElement; public int direction; public int roundaboutExitNumber; }" > src/org/dsi/ifc/navigation/BapManeuverDescriptor.java
        
        # 5. Сервис переключения встроенной карты Virtual Cockpit
        echo "package de.vw.mib.asl.internal.navigation.api.impl.ext.map.instrumentcluster; public class ICMapServiceImpl { public static void notifySwitchMapToAbt() {} }" > src/de/vw/mib/asl/internal/navigation/api/impl/ext/map/instrumentcluster/ICMapServiceImpl.java
        
        # 6. Заглушка для связи с оригинальным отправителем дескрипторов, который остался в прошивке машины
        echo "package de.vw.mib.asl.internal.androidauto.target; public class ManeuverDescriptorSender { public void reset() {} public void send(Object o) {} }" > src/de/vw/mib/asl/internal/androidauto/target/ManeuverDescriptorSender.java
        
        # 7. Константы направления и графических элементов для NavTurn
        echo "package de.vw.mib.asl.internal.androidauto.target; public class ManeuverDescriptorMainElement { public static final int FOLLOW_STREET = 1; public static final int DIRECTION_TO_DESTINATION = 1; public static final int TURN = 1; public static final int EXIT_LEFT = 1; public static final int EXIT_RIGHT = 1; public static final int FORK_2 = 1; public static final int FORK_3 = 1; public static final int UTURN = 1; public static final int PREPARE_ROUNDABOUT = 1; public static final int EXIT_ROUNDABOUT_TRS_LEFT = 1; public static final int EXIT_ROUNDABOUT_TRS_RIGHT = 1; public static final int ROUNDABOUT_TRS_LEFT = 1; public static final int ROUNDABOUT_TRS_RIGHT = 1; public static final int NEAR_DESTINATION = 1; public static final int NO_SYMBOL = 0; }" > src/de/vw/mib/asl/internal/androidauto/target/ManeuverDescriptorMainElement.java
        echo "package de.vw.mib.asl.internal.androidauto.target; public class ManeuverDescriptorDirection { public static final int STRAIGHT = 0; public static final int LEFT = 1; public static final int RIGHT = 2; public static final int LEFT_SLIGHT = 3; public static final int RIGHT_SLIGHT = 4; public static final int LEFT_SHARP = 5; public static final int RIGHT_SHARP = 6; public static final int UTURN = 7; }" > src/de/vw/mib/asl/internal/androidauto/target/ManeuverDescriptorDirection.java

    - name: Compile Java Code
      run: |
        mkdir -p build/classes
        mkdir -p build/out
        
        # Компилируем наши 2 файла и необходимые локальные заглушки структуры
        javac -source 1.6 -target 1.6 -d build/classes \
          src/de/adi961/miblogger/MIBLogger.java \
          src/de/vw/mib/asl/api/navbap/ASLNavBAPFactory.java \
          src/de/vw/mib/bap/mqbab2/common/api/APIFactory.java \
          src/de/vw/mib/bap/mqbab2/common/api/navigation/NavigationASLDataAdapter.java \
          src/org/dsi/ifc/androidauto2/Constants.java \
          src/org/dsi/ifc/navigation/BapManeuverDescriptor.java \
          src/de/vw/mib/asl/internal/navigation/api/impl/ext/map/instrumentcluster/ICMapServiceImpl.java \
          src/de/vw/mib/asl/internal/androidauto/target/ManeuverDescriptorMainElement.java \
          src/de/vw/mib/asl/internal/androidauto/target/ManeuverDescriptorDirection.java \
          src/de/vw/mib/asl/internal/androidauto/target/ManeuverDescriptorSender.java \
          src/de/vw/mib/asl/internal/androidauto/target/NavTurn.java \
          src/de/vw/mib/asl/internal/androidauto/target/NavigationHandler.java
        
    - name: Create JAR Archive
      run: |
        # Упаковываем строго 2 наших скомпилированных измененных класса
        jar cvf build/out/VCAndroidAuto.jar \
          -C build/classes de/vw/mib/asl/internal/androidauto/target/NavigationHandler.class \
          -C build/classes de/vw/mib/asl/internal/androidauto/target/NavTurn.class

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VCAndroidAuto-Fixed-Jar
        path: build/out/VCAndroidAuto.jar
