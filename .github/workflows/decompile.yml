name: Decompile LSD JXE

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Публичная ссылка на lsd.jxe с Яндекс Диска'
        required: true
        default: ''

jobs:
  decompile:
    # Фиксируем стабильную ОС, чтобы избежать предупреждений
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Обновляем версию Java до v5, чтобы убрать предупреждение Node.js 20
    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Download lsd.jxe from Yandex Disk
      run: |
        # Используем официальный API Яндекс Диска для получения прямой ссылки на скачивание
        PUBLIC_URL="${{ github.event.inputs.file_url }}"
        echo "Запрашиваем прямую ссылку у API Яндекс Диска..."
        
        API_RESPONSE=$(curl -s "https://yandex.net{PUBLIC_URL}")
        DOWNLOAD_URL=$(echo $API_RESPONSE | grep -o '"href":"[^"]*' | grep -o '[^"]*$')
        
        if [ -z "$DOWNLOAD_URL" ]; then
          echo "ОШИБКА: Не удалось получить прямую ссылку! Проверьте, что файл открыт для доступа по ссылке."
          exit 1
        fi
        
        echo "Скачиваем файл..."
        wget -O lsd.jxe "$DOWNLOAD_URL"
        
        # Проверяем размер скачанного файла
        FILE_SIZE=$(stat -c%s "lsd.jxe")
        echo "Скачан файл размером: $FILE_SIZE байт"
        if [ $FILE_SIZE -lt 1000000 ]; then
          echo "ОШИБКА: Скачанный файл слишком мал. Вероятно, скачалась ошибка вместо прошивки."
          exit 1
        fi

    - name: Convert JXE to JAR using Docker
      run: |
        docker run --rm -v ${{ github.workspace }}:/data ghcr.io/adi961/jxe2jar:latest bash -c "python2 JXE2JAR.py /data/lsd.jxe /data/lsd.jar"

    - name: Decompile JAR to Java Source Code
      run: |
        mkdir -p tools
        # Скачиваем полную рабочую версию декомпилятора CFR
        wget -O tools/cfr-0.152.jar https://github.com
        
        # Запускаем декомпиляцию
        java -jar tools/cfr-0.152.jar lsd.jar --previewfeatures false --switchexpression false --removeinnerclasssynthetics false --outputdir lsd_source

    - name: Archive Source Code
      run: |
        zip -r lsd_source.zip lsd_source/

    - name: Upload Decompiled Source
      uses: actions/upload-artifact@v4
      with:
        name: MIB2-LSD-Java-Source
        path: lsd_source.zip
